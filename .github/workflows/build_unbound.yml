name: Build image with GHA
on:
  workflow_dispatch:
  push:
    paths: 
      #- 'Containerfile.unbound'
      - 'Dockerfile.unbound'
      - 'unbound-pihole.conf'
    branches:
      - main

jobs:
  unbound-image-build:
    name: Build recursive DNS unbound container
    runs-on: ubuntu-latest
    env:
      
      # Containerfile to build
      CONTAINERFILE: Dockerfile.unbound

      # List of tags to publish
      TAGLIST: latest ${{ github.sha }} ${{ github.ref_name }}

      # Destination registry for built images
      DEST_REGISTRY_HOST: "ghcr.io"
      # Destination credentials - uses platform variables and secrets
      DEST_REGISTRY_USER: "${{ github.actor }}"
      DEST_REGISTRY_PASSWORD: "${{ secrets.GITHUB_TOKEN }}"

      # Destination image namespace and name (eg: myrepo/myimage)
      DEST_IMAGE: "${{ github.actor }}/unbound"

    permissions:
      contents: write
      packages: write

    steps:
      - name: Clone the repository
        uses: actions/checkout@v6

      - name: Get container tools in UBI builder
        run: sudo apt-get -y install podman buildah skopeo

      # workaround for https://github.com/redhat-actions/podman-login/issues/42 since the docker config from the host doesn't come up to the container
      - name: Workaround open podman-login action issue
        env:
          auth: "{ \"auths\": {} }"
        run: |
          mkdir -p $HOME/.docker
          echo $auth > $HOME/.docker/config.json

      - name: Use buildah bud to create the image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.DEST_IMAGE }}
          tags: ${{ env.TAGLIST }}
          containerfiles: ${{ env.CONTAINERFILE }}

      - name: Test - Create pod for unbound
        run: podman pod create --name test-unbound-pod

      - name: Test - Start unbound in pod
        run: |
          podman run -d \
              --pod test-unbound-pod \
              --name test-unbound \
              localhost/${{ steps.build-image.outputs.image }}:${{ github.sha }}
          sleep 3

      - name: Test - DNS resolution over pod localhost
        run: |
          result=$(podman run --rm \
              --pod test-unbound-pod \
              docker.io/alpine \
              sh -c 'apk add -q bind-tools && dig @127.0.0.1 -p 5335 example.com +short')
            echo "Result: ${result}"
            [[ -n "${result}" ]] || { echo "FAIL: no response from unbound at 127.0.0.1:5335"; exit 1; }
            echo "PASS"

      - name: Test - Cleanup pod
        if: always()
        run: podman pod rm -f test-unbound-pod 2>/dev/null || true

      - name: Log in to the destination container registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.DEST_REGISTRY_HOST }}
          username: ${{ env.DEST_REGISTRY_USER }}
          password: ${{ env.DEST_REGISTRY_PASSWORD }}

      - name: Push to destination container Repository
        id: push-to-dest
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.DEST_REGISTRY_HOST }}

