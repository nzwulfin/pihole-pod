name: Test pihole image on PR
on:
  pull_request:
    paths:
      - 'pihole/**'
      - '.github/workflows/test_pihole.yml'
    branches:
      - main
  workflow_dispatch:

jobs:
  test-pihole:
    name: Test pi-hole container standalone
    runs-on: ubuntu-latest

    steps:
      - name: Clone the repository
        uses: actions/checkout@v7

      - name: Get container tools
        run: sudo apt-get -y install podman buildah

      - name: Workaround open podman-login action issue
        env:
          auth: "{ \"auths\": {} }"
        run: |
          mkdir -p $HOME/.docker
          echo $auth > $HOME/.docker/config.json

      - name: Build pi-hole image
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: pihole-test
          tags: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'test' }}
          containerfiles: pihole/Containerfile
          context: pihole/
          # Ubuntu's buildah uses the legacy imagebuilder parser which doesn't support
          # heredoc RUN syntax. Run upstream buildah in a container instead.
          buildah-image: quay.io/buildah/stable

      - name: Establish DNS ground truth
        run: |
          expected=$(dig example.com +short | sort)
          echo "Host resolver says example.com = ${expected}"
          echo "EXPECTED_IP<<EOF" >> $GITHUB_ENV
          echo "${expected}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Start pi-hole container
        run: |
          podman run -d \
            --name test-pihole \
            --cap-add CAP_NET_BIND_SERVICE \
            --cap-add CAP_NET_RAW \
            -p 8053:53/udp -p 8053:53/tcp -p 8080:80/tcp \
            -e FTLCONF_webserver_api_password=test \
            localhost/pihole-test:${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'test' }}

      - name: Wait for DNS to be ready
        run: |
          podman pull quay.io/hummingbird/dig:latest
          podman pull quay.io/hummingbird/curl:latest
          for i in $(seq 1 30); do
            result=$(podman run --rm --network host \
              quay.io/hummingbird/dig:latest @127.0.0.1 -p 8053 example.com +short 2>/dev/null)
            [ -n "${result}" ] && break
            echo "Attempt ${i}: DNS not ready yet, waiting..."
            sleep 3
          done
          echo "Readiness probe result: ${result}"

      - name: Dump pi-hole container logs
        if: always()
        run: podman logs test-pihole 2>&1 || true

      - name: DNS resolution through pi-hole
        run: |
          result=$(podman run --rm --network host \
            quay.io/hummingbird/dig:latest @127.0.0.1 -p 8053 example.com +short 2>/dev/null | sort)
          echo "Result: ${result}"
          echo "Expected: ${EXPECTED_IP}"
          [[ "${result}" == "${EXPECTED_IP}" ]] || { echo "FAIL: expected ${EXPECTED_IP}, got ${result}"; exit 1; }
          echo "PASS"

      - name: Admin web UI responds
        run: |
          result=$(podman run --rm --network host \
            quay.io/hummingbird/curl:latest -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/admin/)
          echo "HTTP status: ${result}"
          [[ "${result}" =~ ^(200|302)$ ]] || { echo "FAIL: admin UI returned ${result}"; exit 1; }
          echo "PASS"

      - name: Gravity database is populated
        run: |
          count=$(podman exec test-pihole pihole-FTL sqlite3 /etc/pihole/gravity.db "SELECT COUNT(*) FROM gravity;")
          echo "Gravity domains: ${count}"
          [[ ${count} -gt 0 ]] || { echo "FAIL: gravity database is empty"; exit 1; }
          echo "PASS"

      - name: Blocklist blocks expected domain
        run: |
          blocked_domain=$(podman exec test-pihole pihole-FTL sqlite3 /etc/pihole/gravity.db "SELECT domain FROM gravity LIMIT 1;")
          echo "Testing domain: ${blocked_domain}"
          result=$(dig @127.0.0.1 -p 8053 "${blocked_domain}" +short)
          echo "Result: ${result}"
          [[ "${result}" == "0.0.0.0" ]] || { echo "FAIL: expected 0.0.0.0 (blocked), got '${result}'"; exit 1; }
          echo "PASS"

      - name: Cleanup
        if: always()
        run: podman rm -f test-pihole 2>/dev/null || true
