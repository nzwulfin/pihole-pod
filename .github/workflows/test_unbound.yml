name: Test unbound image on PR
on:
  pull_request:
    paths:
      - 'unbound/**'
      - '.github/workflows/test_unbound.yml'
    branches:
      - main
  workflow_dispatch:

jobs:
  test-unbound:
    name: Test recursive DNS unbound container
    runs-on: ubuntu-latest

    steps:
      - name: Clone the repository
        uses: actions/checkout@v7

      - name: Get container tools
        run: sudo apt-get -y install podman buildah

      - name: Workaround open podman-login action issue
        env:
          auth: "{ \"auths\": {} }"
        run: |
          mkdir -p $HOME/.docker
          echo $auth > $HOME/.docker/config.json

      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: unbound-test
          tags: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'test' }}
          containerfiles: unbound/Containerfile
          context: unbound/

      - name: Establish DNS ground truth
        run: |
          expected=$(dig example.com +short | sort)
          echo "Host resolver says example.com = ${expected}"
          echo "EXPECTED_IP<<EOF" >> $GITHUB_ENV
          echo "${expected}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create pod
        run: podman pod create --name test-unbound-pod

      - name: Start unbound in pod
        run: |
          podman run -d \
            --pod test-unbound-pod \
            --name test-unbound \
            localhost/unbound-test:${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'test' }}

      - name: Wait for DNS to be ready
        run: |
          podman pull quay.io/hummingbird/dig:latest
          for i in $(seq 1 30); do
            result=$(podman run --rm \
              --pod test-unbound-pod \
              quay.io/hummingbird/dig:latest @127.0.0.1 -p 5335 example.com +short 2>/dev/null)
            [ -n "${result}" ] && break
            echo "Attempt ${i}: DNS not ready yet, waiting..."
            sleep 3
          done
          echo "Readiness probe result: ${result}"

      - name: DNS resolution over pod localhost
        run: |
          result=$(podman run --rm \
            --pod test-unbound-pod \
            quay.io/hummingbird/dig:latest @127.0.0.1 -p 5335 example.com +short | sort)
          echo "Result: ${result}"
          echo "Expected: ${EXPECTED_IP}"
          [[ "${result}" == "${EXPECTED_IP}" ]] || { echo "FAIL: expected ${EXPECTED_IP}, got ${result}"; exit 1; }
          echo "PASS"

      - name: Cleanup pod
        if: always()
        run: podman pod rm -f test-unbound-pod 2>/dev/null || true
